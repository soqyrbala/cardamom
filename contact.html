<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Cardamom Cafe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <nav class="navbar navbar-expand-md navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">Cardamom Cafe</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
            <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <section class="container py-5">
      <h1 class="mb-4">Contact us</h1>
      <div class="row g-5">
        <div class="col-12 col-lg-6">
          <form action="#" method="post">
            <div class="mb-3"><label for="name" class="form-label">Name</label><input type="text" id="name" class="form-control" required></div>
            <div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" id="email" class="form-control" required></div>
            <div class="mb-3"><label for="topic" class="form-label">Topic</label>
              <select id="topic" class="form-select"><option>Table booking</option><option>Cake order</option><option>Feedback</option></select></div>
            <div class="mb-3"><label for="msg" class="form-label">Message</label><textarea id="msg" class="form-control" rows="4"></textarea></div>
            <button type="submit" class="btn btn-accent">Send message</button>
          </form>
        </div>
        <aside class="col-12 col-lg-6">
          <h2 class="h4">Find us</h2>
          <p>12 Saryarka Ave, Astana<br>Phone: +7 700 000 0000</p>
        </aside>
      </div>
    </section>
  </main>
  <footer class="site-footer text-center py-4">
    <p class="mb-1">Cardamom Cafe, 12 Saryarka Ave, Astana</p>
    <p class="mb-0"><span class="accent">Open daily</span> 8:00&ndash;22:00</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
